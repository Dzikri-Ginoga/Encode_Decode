<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KriptoHengker - Crypto Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/styles.css">
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;
      --color-abyss: #0b1220;
      --color-panel: #141d33;
      --color-accent: #22d3ee;
      --color-gold: #fbbf24;
    }
  </style>
</head>
<body class="bg-abyss text-slate-200 font-sans min-h-screen">
  <header class="border-b border-white/10 bg-panel/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex items-center gap-3">
        <i class="iconoir-lock text-2xl text-accent"></i>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">KriptoHengker</h1>
          <p class="text-sm text-slate-400">Classical and modern cipher demo with step trace. All computation runs in the browser.</p>
        </div>
      </div>
      <nav id="tabs" aria-label="Cipher menus" class="flex flex-wrap gap-2 mt-4"></nav>
    </div>
  </header>
  <main id="app" aria-live="polite" class="max-w-6xl mx-auto px-6 py-8"></main>
  <footer class="max-w-6xl mx-auto px-6 pb-10 text-xs text-slate-500">
    <i class="iconoir-shield-check"></i> Educational demo. Step-trace implementations are for learning, not production secrecy.
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
