<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KriptoHengker - Crypto Demo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>KriptoHengker</h1>
    <p>Classical and modern cipher demo with step trace. All computation runs in the browser.</p>
    <nav id="tabs" aria-label="Cipher menus">
      <button data-tab="classic1" class="active">Menu 1 - Classic 1</button>
      <button data-tab="classic2">Menu 2 - Classic 2</button>
      <button data-tab="modern1">Menu 3 - LFSR Stream</button>
      <button data-tab="modern2">Menu 4 - Modern 2</button>
      <button data-tab="super">Menu 5 - Super Encrypt</button>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
